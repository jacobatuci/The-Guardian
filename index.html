<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guardian Security Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
    }

    header {
      padding: 15px 20px;
      background: linear-gradient(90deg, #1e1e1e, #151515);
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #333;
      letter-spacing: 0.5px;
    }

    .container {
      display: flex;
      padding: 20px;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .video-panel {
      flex: 3;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      display: flex;
    }

    .video-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .control-panel {
      flex: 1;
      background: #1e1e1e;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      padding: 12px;
      font-size: 16px;
      background: #2b2b2b;
      color: #eee;
      border: 1px solid #444;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #3a3a3a;
    }

    .indicator {
      font-size: 14px;
      padding: 8px;
      border-radius: 5px;
      background: #222;
      border: 1px solid #333;
    }

    .text-green {
      color: #2ecc71;
      font-weight: bold;
    }

    .text-red {
      color: #e74c3c;
      font-weight: bold;
    }

    .indicator span {
      font-weight: bold;
    }

    .active {
      color: #2ecc71;
    }

    .inactive {
      color: #e74c3c;
    }

    .status {
      margin-top: auto;
      font-size: 14px;
      color: #aaa;
      padding-top: 10px;
      border-top: 1px solid #333;
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }

      .video-panel {
        width: 100%;
      }

      .control-panel {
        width: 100%;
      }

      button {
        font-size: 18px;
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  Guardian Home Security System
</header>

<div class="container">

  <!-- Live Camera Feed -->
  <div class="video-panel">
    <iframe
      src="https://www.youtube.com/embed/live_stream?channel=UCcoP4f6cG1mQXrOSC21V2hQ&autoplay=1&mute=1"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Controls -->
  <div class="control-panel">
      <button id="saveFingerprintBtn">Save Fingerprint</button>
      <button id="deleteFingerprintBtn">Delete Fingerprint</button>

      <button id="lockToggleBtn">
          <span id="lockAction" class="text-green">Activate</span> Lock
      </button>

      <div class="indicator">
        Camera: <span id="cameraStatus" class="inactive">Not Active</span>
      </div>

      <div class="status" id="statusText">
        Status: idle
      </div>
    </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCJ6-mhKmEbUqVjypRtVBK0Ej_yYrUNdoI",
    authDomain: "guardian-home-security-system.firebaseapp.com",
    databaseURL: "https://guardian-home-security-system-default-rtdb.firebaseio.com",
    projectId: "guardian-home-security-system",
    storageBucket: "guardian-home-security-system.appspot.com",
    messagingSenderId: "941548136882",
    appId: "1:941548136882:web:80d607137117d114659cab"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function sendCommand(action) {
    db.ref("command").set({ action });
    document.getElementById("statusText").innerText =
      "Status: " + action.replace("_", " ");
  }

  document.getElementById("saveFingerprintBtn").onclick = () =>
    sendCommand("save_fingerprint");

  document.getElementById("deleteFingerprintBtn").onclick = () =>
    sendCommand("delete_fingerprint");

  let lockActive = false;

  const lockBtn = document.getElementById("lockToggleBtn");
  const lockActionText = document.getElementById("lockAction");

  lockBtn.onclick = () => {
    if (!lockActive) {
      sendCommand("activate_lock");
      lockActionText.innerText = "Deactivate";
      lockActionText.className = "text-red";
      lockActive = true;
    } else {
      sendCommand("deactivate_lock");
      lockActionText.innerText = "Activate";
      lockActionText.className = "text-green";
      lockActive = false;
    }
  };

  db.ref("status/message").on("value", snapshot => {
    if (snapshot.exists()) {
      document.getElementById("statusText").innerText =
        "Status: " + snapshot.val();
    }
  });
</script>

</body>
</html>
