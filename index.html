<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guardian Security Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
    }

    header {
      padding: 15px 20px;
      background: #1e1e1e;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    .container {
      display: flex;
      padding: 20px;
      gap: 20px;
    }

    .video-panel {
      flex: 3;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-panel iframe {
      width: 100%;
      height: 100%;
      min-height: 360px;
      border: none;
    }

    .control-panel {
      flex: 1;
      background: #1e1e1e;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      padding: 12px;
      font-size: 16px;
      background: #2e7dff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #1c5fd1;
    }

    .status {
      margin-top: auto;
      font-size: 14px;
      color: #aaa;
      padding-top: 10px;
      border-top: 1px solid #333;
    }
  </style>
</head>

<body>

<header>
  Guardian Home Security System
</header>

<div class="container">

  <!-- Live Camera Feed -->
  <div class="video-panel">
    <iframe
      src="https://www.youtube.com/embed/live_stream?channel=UCcoP4f6cG1mQXrOSC21V2hQ&autoplay=1&mute=1"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Controls -->
  <div class="control-panel">
    <button id="saveBtn">Save Face</button>
    <div class="status" id="statusText">
      Status: idle
    </div>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCJ6-mhKmEbUqVjypRtVBK0Ej_yYrUNdoI",
    authDomain: "guardian-home-security-system.firebaseapp.com",
    databaseURL: "https://guardian-home-security-system-default-rtdb.firebaseio.com",
    projectId: "guardian-home-security-system",
    storageBucket: "guardian-home-security-system.appspot.com",
    messagingSenderId: "941548136882",
    appId: "1:941548136882:web:80d607137117d114659cab"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  document.getElementById("saveBtn").onclick = function () {
    db.ref("command").set({ action: "save_face" });
    document.getElementById("statusText").innerText =
      "Status: saving face...";
  };

  db.ref("status/message").on("value", snapshot => {
    if (snapshot.exists()) {
      document.getElementById("statusText").innerText =
        "Status: " + snapshot.val();
    }
  });
</script>

</body>
</html>
